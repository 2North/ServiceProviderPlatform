spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spp_db
    username: spp_user
    password: spp_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: change-me-in-production-must-be-at-least-256-bits-long
    expiration: 86400000