services:
  postgres:
    image: postgres:16
    container_name: spp-postgres
    environment:
      POSTGRES_DB: spp_db
      POSTGRES_USER: spp_user
      POSTGRES_PASSWORD: spp_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
